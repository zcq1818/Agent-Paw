[package]
name = "paw"
version = "0.1.0"
description = "皮卡丘桌面宠物 Agent"
authors = ["you"]
edition = "2021"

[lib]
name = "paw_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
