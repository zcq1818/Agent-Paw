# 自动打包发版
# - 推送到 main 时，如果 tauri.conf.json 里的版本号还没有发布过：自动打包、签名，发布 vX.Y.Z（含自动更新用的 latest.json）
#   已经发布过的版本号会直接跳过，所以平时推代码不会发版；想发新版，改版本号推上来就行
# - 推送 vX.Y.Z 标签：同样发布（备用方式）
# - 在 Actions 页面手动运行：只打包，不发布，安装包作为构建产物下载，用来试跑
#
# 需要在仓库 Settings → Secrets and variables → Actions 里添加：
#   TAURI_SIGNING_PRIVATE_KEY  自动更新签名私钥（本机 ~/.tauri/paw-updater.key 的内容）
# 打包用的是仓库里的代码，没进 git 的东西（比如 public/models/pets/custom）不会打进安装包。

name: Release

on:
  push:
    branches: [main]
    paths:
      - src-tauri/tauri.conf.json
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to do
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$version" != "$pkg" ] || [ "$version" != "$cargo" ]; then
            echo "::error::版本号不一致：tauri.conf.json=$version package.json=$pkg Cargo.toml=$cargo"
            exit 1
          fi
          tag="v$version"
          mode=build
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::标签 $GITHUB_REF_NAME 和版本号 $version 对不上，应该打 $tag"
              exit 1
            fi
            mode=publish
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              mode=skip
              echo "::notice::$tag 已经发布过，这次不打包。要发新版请先改版本号"
            else
              mode=publish
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          notes="release-notes/$tag.md"
          {
            echo 'notes<<PAW_NOTES_EOF'
            if [ -f "$notes" ]; then cat "$notes"; else echo "Paw $tag"; fi
            echo
            echo 'PAW_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "版本 $version → $mode"

      - name: Check signing key
        if: steps.meta.outputs.mode != 'skip'
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::仓库 Secrets 里还没有 TAURI_SIGNING_PRIVATE_KEY，打出来的包无法自动更新"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.meta.outputs.mode != 'skip'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.meta.outputs.mode != 'skip'

      - uses: swatinem/rust-cache@v2
        if: steps.meta.outputs.mode != 'skip'
        with:
          workspaces: src-tauri -> target

      - run: npm ci
        if: steps.meta.outputs.mode != 'skip'

      - name: Build and publish release
        if: steps.meta.outputs.mode == 'publish'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: Paw ${{ steps.meta.outputs.tag }}
          releaseBody: ${{ steps.meta.outputs.notes }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

      - name: Build only (manual run)
        if: steps.meta.outputs.mode == 'build'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build

      - name: Upload installer (manual run)
        if: steps.meta.outputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: Paw-${{ steps.meta.outputs.version }}-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  # macOS 版：Windows 版发完之后再跑，把 .dmg 和自动更新包追加到同一个 Release，latest.json 里合并进 darwin 平台。
  # 通用包（Intel 和 Apple 芯片都能装）；没有苹果开发者证书，只做本机签名，第一次打开要在“系统设置 → 隐私与安全性”里点“仍要打开”。
  # 某个版本已经发过 Windows 版但还没有 mac 版时，推一次这个文件就会补上 mac 版。
  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to do
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          mode=build
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            mode=publish
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if echo "$assets" | grep -q '\.app\.tar\.gz$'; then
              mode=skip
              echo "::notice::$tag 已经有 mac 版，这次不打包"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "版本 $version → $mode"

      - uses: actions/setup-node@v4
        if: steps.meta.outputs.mode != 'skip'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.meta.outputs.mode != 'skip'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        if: steps.meta.outputs.mode != 'skip'
        with:
          workspaces: src-tauri -> target

      - run: npm ci
        if: steps.meta.outputs.mode != 'skip'

      - name: Build and publish release (macOS)
        if: steps.meta.outputs.mode == 'publish'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: Paw ${{ steps.meta.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Build only (manual run, macOS)
        if: steps.meta.outputs.mode == 'build'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Upload installer (manual run, macOS)
        if: steps.meta.outputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: Paw-${{ steps.meta.outputs.version }}-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
